version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: loantracker
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    image: node:24
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app:cached
      - /usr/src/app/node_modules
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://loan:pass@db:5432/loantracker
    command: >
      sh -c "corepack enable && corepack prepare pnpm@latest --activate && \
             pnpm install --frozen-lockfile && \
             pnpm --filter @workspace/db run push || true && \
             pnpm --filter @workspace/api-server run dev"
    depends_on:
      - db

volumes:
  db-data: {}
